version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medikiosk-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://medikiosk_user:medikiosk_pass@postgres:5432/medikiosk
      - JWT_SECRET_KEY=medikiosk-super-secure-production-secret-2026-key
      - OCR_PROVIDER=mock
      - SPEECH_PROVIDER=mock
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: medikiosk-postgres
    environment:
      POSTGRES_USER: medikiosk_user
      POSTGRES_PASSWORD: medikiosk_pass
      POSTGRES_DB: medikiosk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
